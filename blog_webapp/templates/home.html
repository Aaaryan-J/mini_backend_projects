<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Aaryan's Blog</title>
</head>

<body>
  <main class="page">
    <nav class="site-header">
      <a class="brand" href="{{ url_for('home') }}">Aaryan's Blog</a>
      {% if session.get("username") %}
        <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
      {% else %}
        <a class="nav-link" href="{{ url_for('login') }}">Login</a>
      {% endif %}
    </nav>
    <section class="content-card">
      <h1 class="page-title">Published Articles</h1>
      <table class="article-list">
    {% if articles %}
    <tbody>
      {% for article in articles %}
      <tr>
        <th scope="row"><a href="{{ url_for('article', article_id=article['id']) }}">{{ article['title'] }}</a></th>
        <td>{{ article['date_published'] }}</td>
      </tr>
      {% endfor %}
    {% endif %}
    </tbody>
      </table>
    </section>
  </main>
</body>

</html>
