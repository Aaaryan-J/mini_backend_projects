<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Update Article - Aaryan's Blog</title>
</head>

<body>
  <main class="page">
    <nav class="site-header">
      <a class="brand" href="{{ url_for('admin') }}">Aaryan's Blog Admin</a>
      <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
    </nav>

    <section class="form-card">
      <h1>Update Article</h1>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if error %}
          <p role="alert">{{ error }}</p>
        {% endif %}
        <label for="title-input">Title</label>
        <input id="title-input" name="title" type="text" value="{{ article['title'] }}" required>

        <label for="datepicker1">Date Published</label>
        <input type="text" name="date" value="{{ article['date_published'] }}" id="datepicker1" required>

        <label for="fieldTextarea">Content</label>
        <textarea name="content" id="fieldTextarea" rows="3" required>{{ article['content'] }}</textarea>

        <button type="submit" class="button">Update article</button>
      </form>
    </section>
  </main>
</body>

</html>
