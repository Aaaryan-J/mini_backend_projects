<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>New Article - Aaryan's Blog</title>
</head>

<body>
  <main class="page">
    <nav class="site-header">
      <a class="brand" href="{{ url_for('admin') }}">Aaryan's Blog Admin</a>
      <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
    </nav>

    <section class="form-card">
      <h1>New Article</h1>
      {% if error %}
        <p role="alert">{{ error }}</p>
      {% endif %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="title-input">Article Title</label>
        <input id="title-input" type="text" name="title" placeholder="enter a title" required>

        <label for="datepicker1">Article Publishing Date</label>
        <input type="text" name="date" id="datepicker1" placeholder="select publishing date" required>

        <label for="fieldTextarea">Article Content</label>
        <textarea id="fieldTextarea" name="content" rows="3" placeholder="enter content of article" required></textarea>

        <button type="submit" class="button">Post article</button>
      </form>
    </section>
  </main>
</body>

</html>
