<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
  <title>Aaryan's Blog</title>
</head>

<body>
  <nav class="navbar bg-1 fg-2">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('home') }}">Aaryan's Blog</a>
    </div>
  </nav>

  <div class="card">
    <div class="card-body">
      <h4 class="card-title">New Article</h4>
        <label for="title-input" class="form-label">Article Title</label>
        <input id="title-input" type="text" class="form-control" placeholder="enter a title" aria-label="title" aria-describedby="basic-addon1">
        
        <label for="datepicker1" class="form-label">Article Publishing Date</label>
        <input type="text" class="form-control w-12" id="datepicker1" data-bs-toggle="datepicker" autocomplete="off" placeholder="select publishing date">        
    
        <label for="fieldTextarea" class="form-label">Article Content</label>
        <textarea class="form-control" id="fieldTextarea" rows="3" placeholder="enter content of article"></textarea>
    
        <button type="button" class="theme-success btn-solid btn-sm">Post article</button>
    </div>
  </div>
</body>

</html>
